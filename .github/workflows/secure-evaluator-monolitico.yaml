name: Central Secure Evaluator (Monolítico)

on:
  workflow_call:
  repository_dispatch:
    types: [evaluate-submission]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código do Aluno
        uses: actions/checkout@v4
        with:
          path: student_code

      - name: Checkout do Cofre de Gabaritos (Monolítico)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gabaritos-privados
          token: ${{ secrets.GABARITOS_READ_TOKEN }}
          path: classroom_gabaritos

      - name: Criar Diretório de Saída
        run: mkdir -p output

      - name: Executar Motor de Avaliação em Docker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOCKER_IMAGE: ${{ vars.AUTOGRADER_DOCKER_IMAGE || 'markinsilva/classroom50-ai-autograder:v2.0' }}
        run: |
          ASSIGNMENT_NAME="${{ github.event.inputs.assignment || env.ASSIGNMENT }}"
          
          docker run --rm \
            -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
            -v "$(pwd)/student_code:/app/submission" \
            -v "$(pwd)/classroom_gabaritos/${ASSIGNMENT_NAME}:/app/reference" \
            -v "$(pwd)/output:/app/output" \
            "${DOCKER_IMAGE}"

      - name: Publicar Resultado no GitHub Actions Summary
        if: always()
        run: |
          if [ -f "output/results.json" ]; then
            cat output/results.json >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::O relatório de avaliação em output/results.json não foi gerado." >> $GITHUB_STEP_SUMMARY
          fi
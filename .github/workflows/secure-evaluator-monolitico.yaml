name: Central Secure Evaluator (Monolítico)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código do Aluno
        uses: actions/checkout@v4
        with:
          path: student_code

      - name: Checkout do Cofre de Gabaritos (Monolítico)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gabaritos-privados
          token: ${{ secrets.GABARITOS_READ_TOKEN }}
          path: classroom_gabaritos

      - name: Criar Diretório de Saída
        run: mkdir -p output

      - name: Executar Motor de Avaliação em Docker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOCKER_IMAGE: ${{ vars.AUTOGRADER_DOCKER_IMAGE || 'markinsilva/classroom50-ai-autograder:v2.0' }}
        run: |
          ASSIGNMENT_NAME="${{ github.event.inputs.assignment || env.ASSIGNMENT }}"
          
          docker run --rm \
            -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
            -v "$(pwd)/student_code:/app/submission" \
            -v "$(pwd)/classroom_gabaritos/${ASSIGNMENT_NAME}:/app/reference" \
            -v "$(pwd)/output:/app/output" \
            "${DOCKER_IMAGE}"

      - name: Publicar Resultado e Comentar no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fazendo upload do result.json..."
          gh release delete "${{ github.ref_name }}" -y -R "${{ github.repository }}" || true
          gh release create "${{ github.ref_name }}" ./result.json \
            -R "${{ github.repository }}" \
            --title "Avaliação IA (${{ github.ref_name }})" \
            --notes-file ./feedback.md

          echo "Adicionando comentário no Feedback PR..."
          gh pr comment main -R "${{ github.repository }}" --body-file ./feedback.md || echo "Nenhum PR aberto encontrado para comentar."
name: Central Secure Evaluator

on:
  workflow_call:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do código do aluno
        uses: actions/checkout@v4
        with:
          path: student_code

      - name: 2. Checkout dos scripts do autograder (classroom50)
        uses: actions/checkout@v4
        with:
          repository: ufla-classroom50/classroom50
          ref: main
          path: classroom_central
          token: ${{ secrets.CENTRAL_REPO_READ_TOKEN }}

      - name: 3. Checkout dos Gabaritos Privados
        uses: actions/checkout@v4
        with:
          repository: ufla-classroom50/gabaritos-privados
          ref: main
          path: classroom_gabaritos
          token: ${{ secrets.GABARITOS_READ_TOKEN }}

      - name: 4. Executar Avaliação com o Motor Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -m pip install --quiet google-generativeai
          python3 classroom_central/testes-classroom50/autograders/autograder.py

      - name: 5. Publicar Resultado e Comentar no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fazendo upload do result.json..."
          gh release delete "${{ github.ref_name }}" -y -R "${{ github.repository }}" || true
          gh release create "${{ github.ref_name }}" ./result.json \
            -R "${{ github.repository }}" \
            --title "Avaliação IA (${{ github.ref_name }})" \
            --notes-file ./feedback.md

          echo "Adicionando comentário no Feedback PR..."
          gh pr comment main -R "${{ github.repository }}" --body-file ./feedback.md || echo "Nenhum PR aberto encontrado para comentar."